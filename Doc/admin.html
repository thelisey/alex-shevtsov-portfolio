<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter Tight', sans-serif;
            background-color: #0D015F;
            color: white;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button, a.button {
            background-color: #FFD700;
            color: #0D015F;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-family: 'Inter Tight', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover, a.button:hover {
            background-color: #FFC700;
            transform: translateY(-2px);
        }

        button:active, a.button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #5E4FD7;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #6E5FE8;
        }

        .btn-danger {
            background-color: #D72F2F;
            color: white;
        }

        .btn-danger:hover {
            background-color: #E04040;
        }

        a.button {
            background-color: #5E4FD7;
            color: white;
        }

        a.button:hover {
            background-color: #6E5FE8;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background-color: #5E4FD7;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .file-input-label:hover {
            background-color: #7568E6;
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: #1A0F7F;
            border-radius: 0.75rem;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(255, 215, 0, 0.2);
        }

        .card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .card.drag-over {
            border-color: #FFD700;
            transform: scale(0.95);
        }

        .card.featured {
            border-color: #FFD700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        .card-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background-color: #0D015F;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-thumbnail.video {
            background: linear-gradient(135deg, #1A0F7F 0%, #0D015F 100%);
        }

        .video-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .card-title {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .card-title input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.25rem;
            color: white;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            width: 100%;
            padding: 0.25rem;
            outline: none;
        }

        .card-title input:focus {
            border-color: #FFD700;
        }

        .card-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            z-index: 10;
        }

        .card-btn {
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: background-color 0.2s ease;
        }

        .card-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        .card-btn.featured {
            background-color: #FFD700;
            color: #0D015F;
        }

        .card-btn.featured:hover {
            background-color: #FFC700;
        }

        .card-btn.delete-btn:hover {
            background-color: #D72F2F;
        }

        .drag-handle {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            width: 2rem;
            height: 2rem;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: grab;
            user-select: none;
            z-index: 10;
        }

        .card:active .drag-handle {
            cursor: grabbing;
        }

        /* Add card */
        .card-add {
            background-color: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            min-height: 240px;
        }

        .card-add:hover {
            border-color: #FFD700;
            background-color: rgba(255,215,0,0.05);
        }

        .card-add-icon {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: rgba(255,255,255,0.4);
        }

        .card-add-text {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.4);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1A0F7F;
            border-radius: 1rem;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        .modal-close:hover {
            color: white;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem;
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #FFD700;
        }

        .form-group select option {
            background: #1A0F7F;
            color: white;
        }

        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #FFD700;
            background: rgba(255,215,0,0.05);
        }

        .upload-zone.has-file {
            border-color: #5FA033;
            background: rgba(45,80,22,0.2);
        }

        .upload-zone-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: rgba(255,255,255,0.4);
        }

        .upload-zone-text {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.5);
        }

        .upload-zone-filename {
            font-size: 0.875rem;
            color: #B0E76F;
            margin-top: 0.5rem;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-actions button {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #B0A4D4;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .status-message {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background-color: #2D5016;
            color: #B0E76F;
            border: 1px solid #5FA033;
        }

        .status-message.error {
            background-color: #5F1A1A;
            color: #FF9999;
            border: 1px solid #A03333;
        }

        .status-message.info {
            background-color: #1A3A5F;
            color: #99CCFF;
            border: 1px solid #3366A0;
        }

        .item-count {
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            button, a.button, .file-input-label {
                width: 100%;
                text-align: center;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gallery Admin <span class="item-count" id="itemCount"></span></h1>
            <div class="header-actions">
                <button onclick="saveGallery()">Save</button>
                <a href="index.html" class="button" target="_blank">Preview</a>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)">
                    <label for="fileInput" class="file-input-label">Load JSON</label>
                </div>
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div id="gallery" class="grid"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No gallery items loaded</h2>
            <p>Use "Load JSON" to import your gallery.json file.</p>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
            <h2>Add to Gallery</h2>

            <div class="form-group">
                <label>Type</label>
                <select id="addType" onchange="updateUploadZone()">
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                </select>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="addTitle" placeholder="e.g. Untitled XVIII">
            </div>

            <div class="form-group" id="fileUploadGroup">
                <label>File</label>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('addFile').click()">
                    <div class="upload-zone-icon">&#8593;</div>
                    <div class="upload-zone-text" id="uploadText">Click to select image (JPG, PNG, WebP)</div>
                    <div class="upload-zone-filename" id="uploadFilename"></div>
                    <input type="file" id="addFile" accept="image/*" onchange="handleFileSelect(event)">
                </div>
            </div>

            <div class="form-group" id="videoPathGroup" style="display:none">
                <label>Video filename</label>
                <input type="text" id="addVideoPath" placeholder="e.g. my_video.mp4">
                <div style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:0.5rem;">
                    Put the .mp4 file in <code style="background:rgba(255,255,255,0.1);padding:0.1rem 0.3rem;border-radius:3px;">uploads/works/</code> folder and enter the filename here
                </div>
            </div>


            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
                <button onclick="addItem()">Add</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            <h2>Delete Item</h2>
            <p style="margin-bottom:1rem; color:rgba(255,255,255,0.7);">Are you sure you want to remove <strong id="deleteItemTitle"></strong> from the gallery?</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let galleryItems = [];
        let draggedItem = null;
        let draggedIndex = null;
        let pendingDeleteIndex = null;
        let pendingFileData = null;

        // Initialize
        window.addEventListener('load', () => loadGalleryJson());

        async function loadGalleryJson() {
            try {
                const response = await fetch('gallery.json');
                if (!response.ok) throw new Error('Failed');
                galleryItems = await response.json();
                renderGallery();
                syncToLocalStorage();
                showStatus('Gallery loaded — ' + galleryItems.length + ' items', 'success');
            } catch (error) {
                showStatus('Could not load gallery.json. Use "Load JSON" to import.', 'info');
                showEmptyState();
            }
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    galleryItems = JSON.parse(e.target.result);
                    if (!Array.isArray(galleryItems)) throw new Error('Must be an array');
                    renderGallery();
                    syncToLocalStorage();
                    showStatus('Loaded ' + galleryItems.length + ' items from file', 'success');
                } catch (error) {
                    showStatus('Error: ' + error.message, 'error');
                    showEmptyState();
                }
            };
            reader.readAsText(file);
        }

        // ---- Render ----

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('itemCount').textContent = galleryItems.length ? `(${galleryItems.length})` : '';

            emptyState.style.display = galleryItems.length === 0 ? 'block' : 'none';

            // Cards + add button at the end
            gallery.innerHTML = galleryItems.map((item, i) => createCardHTML(item, i)).join('')
                + `<div class="card-add" onclick="openAddModal()">
                     <div class="card-add-icon">+</div>
                     <div class="card-add-text">Add image or video</div>
                   </div>`;

            // Attach events
            galleryItems.forEach((item, index) => {
                const card = document.querySelector(`.card[data-index="${index}"]`);
                if (!card) return;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragleave', handleDragLeave);

                card.querySelector('.featured-btn')?.addEventListener('click', () => toggleFeatured(index));
                card.querySelector('.delete-btn')?.addEventListener('click', () => openDeleteModal(index));

                const titleInput = card.querySelector('.title-input');
                if (titleInput) {
                    titleInput.addEventListener('change', (e) => {
                        galleryItems[index].title = e.target.value;
                        syncToLocalStorage();
                    });
                }
            });
        }

        function createCardHTML(item, index) {
            const featuredClass = item.featured ? 'featured' : '';
            const isVideo = item.type === 'video';

            let thumbnailHTML;
            if (isVideo) {
                const videoSrc = item.src && !item.src.startsWith('data:') ? item.src : '';
                thumbnailHTML = `<div class="card-thumbnail video">
                    ${videoSrc ? `<video src="${videoSrc}" muted style="width:100%;height:100%;object-fit:cover;"></video>` : ''}
                    <div class="video-badge">▶</div>
                </div>`;
            } else {
                thumbnailHTML = `<div class="card-thumbnail"><img src="${item.src}" alt="${escapeHTML(item.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'color:rgba(255,255,255,0.3);font-size:0.8rem\\'>No preview</div>'"></div>`;
            }

            return `
                <div class="card ${featuredClass}" data-index="${index}" draggable="true">
                    <div class="drag-handle">≡</div>
                    <div class="card-actions">
                        <button class="card-btn featured-btn ${featuredClass}" title="Toggle featured">★</button>
                        <button class="card-btn delete-btn" title="Delete">×</button>
                    </div>
                    ${thumbnailHTML}
                    <div class="card-title">
                        <input class="title-input" type="text" value="${escapeHTML(item.title)}" />
                    </div>
                </div>
            `;
        }

        // ---- Drag & Drop ----

        function handleDragStart(e) {
            draggedItem = this;
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd() {
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
                document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                draggedItem = null;
                draggedIndex = null;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (draggedItem && draggedItem !== this) this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            if (e.target === this) this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedItem || draggedItem === this) return;

            const targetIndex = parseInt(this.dataset.index);
            const item = galleryItems.splice(draggedIndex, 1)[0];
            const insertAt = draggedIndex < targetIndex ? targetIndex - 1 : targetIndex;
            galleryItems.splice(insertAt, 0, item);

            this.classList.remove('drag-over');
            renderGallery();
            syncToLocalStorage();
        }

        // ---- Featured ----

        function toggleFeatured(index) {
            galleryItems[index].featured = !galleryItems[index].featured;
            renderGallery();
            syncToLocalStorage();
        }

        // ---- Delete ----

        function openDeleteModal(index) {
            pendingDeleteIndex = index;
            document.getElementById('deleteItemTitle').textContent = galleryItems[index].title;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            pendingDeleteIndex = null;
            document.getElementById('deleteModal').classList.remove('active');
        }

        function confirmDelete() {
            if (pendingDeleteIndex !== null) {
                const title = galleryItems[pendingDeleteIndex].title;
                galleryItems.splice(pendingDeleteIndex, 1);
                renderGallery();
                syncToLocalStorage();
                showStatus(`"${title}" removed`, 'success');
            }
            closeDeleteModal();
        }

        // ---- Add ----

        function openAddModal() {
            pendingFileData = null;
            document.getElementById('addTitle').value = '';
            document.getElementById('addFile').value = '';
            document.getElementById('addVideoPath').value = '';
            document.getElementById('uploadFilename').textContent = '';
            document.getElementById('uploadZone').classList.remove('has-file');
            updateUploadZone();
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        function updateUploadZone() {
            const type = document.getElementById('addType').value;
            const fileUploadGroup = document.getElementById('fileUploadGroup');
            const videoPathGroup = document.getElementById('videoPathGroup');

            if (type === 'video') {
                fileUploadGroup.style.display = 'none';
                videoPathGroup.style.display = 'block';
            } else {
                fileUploadGroup.style.display = 'block';
                videoPathGroup.style.display = 'none';
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const zone = document.getElementById('uploadZone');
            document.getElementById('uploadFilename').textContent = file.name;
            zone.classList.add('has-file');

            // Auto-fill title from filename
            const titleInput = document.getElementById('addTitle');
            if (!titleInput.value) {
                titleInput.value = file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
            }

            const type = document.getElementById('addType').value;

            // Convert both images and videos to base64
            const reader = new FileReader();
            reader.onload = (e) => { pendingFileData = e.target.result; };
            reader.readAsDataURL(file);
        }

        function addItem() {
            const type = document.getElementById('addType').value;
            const title = document.getElementById('addTitle').value.trim() || 'Untitled';
            let src = '';

            if (type === 'video') {
                const videoFilename = document.getElementById('addVideoPath').value.trim();
                if (!videoFilename) {
                    showStatus('Enter the video filename', 'error');
                    return;
                }
                src = 'uploads/works/' + videoFilename;
            } else {
                if (!pendingFileData) {
                    showStatus('Please select an image', 'error');
                    return;
                }
                src = pendingFileData;
            }

            const newItem = {
                id: String(Date.now()),
                type: type,
                src: src,
                title: title,
                featured: false
            };

            galleryItems.push(newItem);
            closeAddModal();
            renderGallery();
            syncToLocalStorage();
            showStatus(`"${title}" added`, 'success');
        }

        // ---- Sync & Save ----

        function syncToLocalStorage() {
            try {
                const json = JSON.stringify(galleryItems);
                // Check size before storing (~5MB localStorage limit)
                if (json.length > 4 * 1024 * 1024) {
                    console.warn('Gallery data too large for localStorage preview (' + Math.round(json.length/1024/1024) + 'MB). Use Save + deploy instead.');
                    return;
                }
                localStorage.setItem('gallery_preview', json);
            } catch(e) {
                console.warn('localStorage sync failed:', e.message);
            }
        }

        function saveGallery() {
            try {
                const json = JSON.stringify(galleryItems, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'gallery.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('gallery.json saved — replace the file in your project folder', 'success');
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // ---- Utils ----

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type} show`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showEmptyState() {
            document.getElementById('gallery').innerHTML = `
                <div class="card-add" onclick="openAddModal()">
                    <div class="card-add-icon">+</div>
                    <div class="card-add-text">Add image or video</div>
                </div>`;
            document.getElementById('emptyState').style.display = 'block';
        }

        function escapeHTML(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        // Close modals on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
            }
        });

        // Drag & drop on upload zone
        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                const addFile = document.getElementById('addFile');
                const dt = new DataTransfer();
                dt.items.add(file);
                addFile.files = dt.files;
                handleFileSelect({ target: addFile });
            }
        });
    </script>
</body>
</html>

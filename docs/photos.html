<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — Alex Shevtsov</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter Tight', sans-serif;
      background-color: #0D015F;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Page layout — 8-column grid */
    .page-layout {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      column-gap: calc((100vw - 160px) / 31);
      padding: 0 80px;
      min-height: 100vh;
    }

    .main-content {
      grid-column: 1 / 7;
      grid-row: 1;
      display: grid;
      grid-template-columns: subgrid;
      grid-template-rows: 1fr;
      min-height: 100vh;
      padding-top: 5rem;
      padding-bottom: 4rem;
      row-gap: 5rem;
      align-items: center;
    }

    .sidebar {
      grid-column: 8 / 9;
      grid-row: 1;
      position: sticky;
      top: 0;
      height: 100vh;
      align-self: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 1.5rem;
    }

    .sidebar-name {
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .sidebar-decoration {
      flex: 1;
      position: relative;
      overflow: visible;
    }

    .sidebar-decoration::after {
      content: '';
      position: absolute;
      left: calc(-1.5rem - (100vw - 160px) / 62);
      top: 50%;
      transform: translateY(-50%) rotate(30deg);
      width: 1px;
      height: 250px;
      background: #ffffff;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar-nav a {
      font-family: 'Inter Tight', sans-serif;
      font-size: 22px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .sidebar-nav a:hover {
      color: #ffffff;
    }

    .sidebar-nav a.active {
      position: relative;
    }

    .sidebar-nav a.active::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 0.5em;
      vertical-align: middle;
    }

    .sidebar-social {
      margin-top: 2rem;
    }

    .sidebar-social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .sidebar-social a:hover {
      opacity: 1;
    }

    .sidebar-social svg {
      transition: stroke 0.3s ease;
    }

    .sidebar-social a:hover svg {
      stroke: #ffffff;
    }

    /* About section — columns 1-3 */
    .about-text {
      grid-column: 1 / 4;
      font-size: 22px;
      color: #ffffff;
      line-height: 1.4;
    }

    /* Hero quote — columns 3 to mid-6 */
    .hero {
      grid-column: 3 / 7;
      max-width: 90%;
    }

    .hero-quote {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(1.8rem, 2.64vw, 2.64rem);
      line-height: 1.2;
      font-weight: 700;
      color: #ffffff;
    }

    .gallery-spacer {
      grid-column: 1 / 7;
    }

    /* Gallery — columns 1-6, 2 CSS columns */
    .gallery {
      grid-column: 1 / 7;
      column-count: 2;
      column-gap: calc((100vw - 160px) / 31);
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 2.4rem;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-item video {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-item-overlay {
      display: none;
    }

    .play-icon {
      display: none;
    }

    /* Tablet breakpoint */
    @media (max-width: 1024px) {
      .sidebar-decoration {
        display: none;
      }

      .about-text {
        grid-column: 1 / 6;
      }

      .hero {
        grid-column: 2 / 6;
        max-width: none;
      }

      .gallery {
        column-count: 1;
      }
    }

    /* Mobile header */
    .mobile-header {
      display: none;
    }
    .mobile-menu-overlay {
      display: none;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4.5rem 4.5rem 2rem;
        position: relative;
        z-index: 100;
      }

      .mobile-menu-btn {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px;
      }

      .mobile-menu-btn span {
        display: block;
        width: 48px;
        height: 3px;
        background: #ffffff;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }

      /* Mobile menu overlay */
      .mobile-menu-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0D015F;
        z-index: 1000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 3rem;
      }

      .mobile-menu-overlay.active {
        display: flex;
      }

      .mobile-menu-close {
        position: absolute;
        top: 4.5rem;
        right: 4.5rem;
        background: none;
        border: none;
        cursor: pointer;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-menu-close span {
        position: absolute;
        width: 48px;
        height: 3px;
        background: #ffffff;
      }

      .mobile-menu-close span:first-child {
        transform: rotate(45deg);
      }

      .mobile-menu-close span:last-child {
        transform: rotate(-45deg);
      }

      .mobile-menu-nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      .mobile-menu-nav a {
        font-family: 'Inter Tight', sans-serif;
        font-size: 2rem;
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
      }

      .mobile-menu-social a {
        color: rgba(255, 255, 255, 0.7);
      }

      .page-layout {
        display: block;
        padding: 0 4.5rem;
      }

      .main-content {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        min-height: auto;
        padding-top: 0;
        padding-bottom: 3rem;
      }

      .sidebar {
        display: none;
      }


      .about-text {
        font-size: 16px;
      }

      .hero {
        max-width: none;
      }

      .hero-quote {
        font-size: clamp(1.4rem, 5vw, 2rem);
      }

      .gallery-spacer {
        display: none;
      }

      .gallery {
        column-count: 1;
      }

      .gallery-item {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>

<body>

      </svg>
    </div>
    <button class="mobile-menu-btn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile menu overlay -->
  <div class="mobile-menu-overlay">
    <button class="mobile-menu-close" aria-label="Close menu">
      <span></span>
      <span></span>
    </button>
    <nav class="mobile-menu-nav">
      <a href="index.html">Paintings</a>
      <a href="photos.html" class="active">Photos</a>
      <a href="about.html">About</a>
    </nav>
    <div class="mobile-menu-social">
      <a href="https://www.instagram.com/afoxrunningbytheedgeofthesea/" target="_blank" aria-label="Instagram">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>

      </a>
    </div>
  </div>

  <div class="page-layout">
    <main class="main-content">
      <div class="about-text">Coming soon</div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-name">Alex<br>Shevtsov</div>
      <div class="sidebar-decoration"></div>
      <nav class="sidebar-nav">
        <a href="index.html">Paintings</a>
        <a href="photos.html" class="active">Photos</a>
        <a href="about.html">About</a>
      </nav>
      <div class="sidebar-social">
        <a href="https://www.instagram.com/afoxrunningbytheedgeofthesea/" target="_blank" aria-label="Instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"></path><circle cx="17.5" cy="6.5" r="1.5"></circle></svg>
        </a>
      </div>
    </aside>
  </div>

  <script>
    // Mobile menu toggle
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mobileMenuOverlay = document.querySelector('.mobile-menu-overlay');
    const mobileMenuClose = document.querySelector('.mobile-menu-close');
    const mobileMenuLinks = document.querySelectorAll('.mobile-menu-nav a');

    mobileMenuBtn.addEventListener('click', () => {
      mobileMenuOverlay.classList.add('active');
    });

    mobileMenuClose.addEventListener('click', () => {
      mobileMenuOverlay.classList.remove('active');
    });

    mobileMenuLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenuOverlay.classList.remove('active');
      });
    });
  </script>
</body>
</html>

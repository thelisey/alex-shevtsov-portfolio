<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter Tight', sans-serif;
            background-color: #0D015F;
            color: white;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button, a.button {
            background-color: #FFD700;
            color: #0D015F;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-family: 'Inter Tight', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover, a.button:hover {
            background-color: #FFC700;
            transform: translateY(-2px);
        }

        button:active, a.button:active {
            transform: translateY(0);
        }

        a.button {
            background-color: #5E4FD7;
            color: white;
        }

        a.button:hover {
            background-color: #7568E6;
            background-color: #6E5FE8;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background-color: #5E4FD7;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .file-input-label:hover {
            background-color: #7568E6;
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: #1A0F7F;
            border-radius: 0.75rem;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(255, 215, 0, 0.2);
        }

        .card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .card.drag-over {
            border-color: #FFD700;
            transform: scale(0.95);
        }

        .card.featured {
            border-color: #FFD700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        .card-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background-color: #0D015F;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-thumbnail.video {
            background: linear-gradient(135deg, #1A0F7F 0%, #0D015F 100%);
        }

        .video-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .card-title {
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .card-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            z-index: 10;
        }

        .card-btn {
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .card-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        .card-btn.featured {
            background-color: #FFD700;
            color: #0D015F;
        }

        .card-btn.featured:hover {
            background-color: #FFC700;
        }

        .drag-handle {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            width: 2rem;
            height: 2rem;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: grab;
            user-select: none;
            z-index: 10;
        }

        .card:active .drag-handle {
            cursor: grabbing;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #B0A4D4;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .status-message {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background-color: #2D5016;
            color: #B0E76F;
            border: 1px solid #5FA033;
        }

        .status-message.error {
            background-color: #5F1A1A;
            color: #FF9999;
            border: 1px solid #A03333;
        }

        .status-message.info {
            background-color: #1A3A5F;
            color: #99CCFF;
            border: 1px solid #3366A0;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            button, a.button, .file-input-label {
                width: 100%;
                text-align: center;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gallery Admin</h1>
            <div class="header-actions">
                <button id="saveBtn" onclick="saveGallery()">Save</button>
                <a href="index.html" class="button" target="_blank">Preview</a>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)">
                    <label for="fileInput" class="file-input-label">Load JSON</label>
                </div>
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div id="gallery" class="grid"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No gallery items loaded</h2>
            <p>Use "Load JSON" to import your gallery.json file.</p>
        </div>
    </div>

    <script>
        let galleryItems = [];
        let draggedItem = null;
        let draggedIndex = null;

        // Initialize on page load
        window.addEventListener('load', () => {
            loadGalleryJson();
        });

        // Attempt to load gallery.json from the same directory
        async function loadGalleryJson() {
            try {
                const response = await fetch('gallery.json');
                if (!response.ok) {
                    throw new Error('Failed to load gallery.json');
                }
                galleryItems = await response.json();
                renderGallery();
                showStatus('Gallery loaded successfully', 'success');
            } catch (error) {
                showStatus('Could not load gallery.json automatically. Please use "Load JSON" button to import it.', 'info');
                showEmptyState();
            }
        }

        // Load from file input
        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    galleryItems = JSON.parse(e.target.result);
                    if (!Array.isArray(galleryItems)) {
                        throw new Error('Gallery data must be an array');
                    }
                    renderGallery();
                    showStatus('Gallery loaded from file', 'success');
                } catch (error) {
                    showStatus(`Error loading file: ${error.message}`, 'error');
                    showEmptyState();
                }
            };
            reader.readAsText(file);
        }

        // Render the gallery grid
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');

            if (galleryItems.length === 0) {
                gallery.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            gallery.innerHTML = galleryItems.map((item, index) => createCardHTML(item, index)).join('');

            // Attach event listeners to cards
            galleryItems.forEach((item, index) => {
                const card = document.querySelector(`[data-index="${index}"]`);
                if (card) {
                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragend', handleDragEnd);
                    card.addEventListener('dragover', handleDragOver);
                    card.addEventListener('drop', handleDrop);
                    card.addEventListener('dragleave', handleDragLeave);

                    const featuredBtn = card.querySelector('.featured-btn');
                    if (featuredBtn) {
                        featuredBtn.addEventListener('click', () => toggleFeatured(index));
                    }
                }
            });
        }

        // Create card HTML
        function createCardHTML(item, index) {
            const isFeatured = item.featured ? 'featured' : '';
            const starClass = item.featured ? 'featured' : '';
            const isVideo = item.type === 'video';

            let thumbnailHTML;
            if (isVideo) {
                thumbnailHTML = `
                    <div class="card-thumbnail video">
                        <div class="video-badge">▶</div>
                    </div>
                `;
            } else {
                thumbnailHTML = `
                    <div class="card-thumbnail">
                        <img src="${item.src}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
                    </div>
                `;
            }

            return `
                <div class="card ${isFeatured}" data-index="${index}" draggable="true">
                    <div class="drag-handle">≡</div>
                    <div class="card-actions">
                        <button class="card-btn featured-btn ${starClass}" title="Toggle featured">★</button>
                    </div>
                    ${thumbnailHTML}
                    <div class="card-title">${escapeHTML(item.title)}</div>
                </div>
            `;
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            draggedItem = this;
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
                document.querySelectorAll('.card').forEach(card => {
                    card.classList.remove('drag-over');
                });
                draggedItem = null;
                draggedIndex = null;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            if (draggedItem && draggedItem !== this) {
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            if (e.target === this) {
                this.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();

            if (!draggedItem || draggedItem === this) return;

            const targetIndex = parseInt(this.dataset.index);

            // Reorder the items array
            if (draggedIndex < targetIndex) {
                const draggedItemData = galleryItems[draggedIndex];
                galleryItems.splice(draggedIndex, 1);
                galleryItems.splice(targetIndex - 1, 0, draggedItemData);
            } else {
                const draggedItemData = galleryItems[draggedIndex];
                galleryItems.splice(draggedIndex, 1);
                galleryItems.splice(targetIndex, 0, draggedItemData);
            }

            this.classList.remove('drag-over');
            renderGallery();
        }

        // Toggle featured state
        function toggleFeatured(index) {
            galleryItems[index].featured = !galleryItems[index].featured;
            renderGallery();
        }

        // Save gallery to JSON file
        function saveGallery() {
            try {
                const jsonString = JSON.stringify(galleryItems, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'gallery.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showStatus('Gallery saved successfully!', 'success');
            } catch (error) {
                showStatus(`Error saving gallery: ${error.message}`, 'error');
            }
        }

        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} show`;

            // Auto-hide after 5 seconds
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 5000);
        }

        // Show empty state
        function showEmptyState() {
            document.getElementById('gallery').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Escape HTML to prevent XSS
        function escapeHTML(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, char => map[char]);
        }
    </script>
</body>
</html>
